name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.rst"
      - "isochrones/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.rst"
      - "isochrones/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Only one deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      # nbsphinx converts the notebooks' markdown cells with pandoc.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      # The package is installed for real so autodoc can import it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r docs/requirements.txt

      # Warnings fail the build so the published docs stay clean.  Notebooks
      # are not executed (nbsphinx_execute = "never"), so no model grids are
      # downloaded.
      - name: Build HTML
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Disable Jekyll
        run: touch docs/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pull requests only build; the site is published from master.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
